services:
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: novelagent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./App_Data/Qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novelagent-api
    ports:
      - "5002:5002"
    volumes:
      - ./Web/NovelAgentWeb/App_Data:/app/App_Data
    environment:
      - ASPNETCORE_URLS=http://+:5002
      - ASPNETCORE_ENVIRONMENT=Development
      - Qdrant__Host=qdrant
      - Qdrant__Port=6333
      - Redis__ConnectionString=host.docker.internal:6379
    depends_on:
      - qdrant
    restart: unless-stopped
