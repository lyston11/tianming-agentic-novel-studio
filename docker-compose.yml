services:
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: novelagent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./App_Data/Qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: novelagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novelagent-api
    ports:
      - "5002:5002"
    volumes:
      - ./Web/NovelAgentWeb/App_Data:/app/App_Data
    environment:
      - ASPNETCORE_URLS=http://+:5002
      - ASPNETCORE_ENVIRONMENT=Development
      - Qdrant__BaseUrl=http://qdrant:6333
      - Qdrant__Host=qdrant
      - Qdrant__Port=6334
      - Redis__Enabled=true
      - Redis__ConnectionString=redis:6379
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

volumes:
  redis-data:
