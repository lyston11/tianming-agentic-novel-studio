name: Real Provider

on:
  workflow_dispatch:

concurrency:
  group: real-provider-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deepseek:
    name: Official DeepSeek end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Check credential availability
        id: credential
        shell: bash
        run: |
          if [[ -n "$DEEPSEEK_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "DEEPSEEK_API_KEY is not configured; skipping the paid real-provider test."
          fi
      - if: steps.credential.outputs.available == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - if: steps.credential.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.credential.outputs.available == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.credential.outputs.available == 'true'
        run: pnpm test:dsh:real
