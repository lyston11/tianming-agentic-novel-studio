<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据库方案详解 - 多用户小说创作系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1410 0%, #2d1f15 100%);
      color: #f4ecd9;
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(58, 44, 30, 0.6);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    h2 {
      font-size: 28px;
      color: #f4ecd9;
      margin-bottom: 8px;
      font-weight: 700;
    }
    code {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container" id="content"></div>
  <script>
    fetch('content/database-detailed-chinese.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('content').innerHTML = html;
      });
  </script>
</body>
</html>
